name: Deploy Odoo Module

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "Environment set to PRODUCTION"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "ENV=test" >> $GITHUB_OUTPUT
            echo "Environment set to TEST"
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/670649208826/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-deploy-sa@odoo-ia-prop-com.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to all Odoo VMs
        run: |
          MODULE_NAME=$(basename "${{ github.repository }}")
          ENVIRONMENT="${{ steps.env.outputs.ENV }}"

          echo "🚀 Deploying $MODULE_NAME to $ENVIRONMENT across all VMs"

          # Discover all VMs with a 'domain' label (indicates Odoo instance)
          VMS=$(gcloud compute instances list \
            --project=odoo-ia-prop-com \
            --filter="status=RUNNING AND labels.domain:*" \
            --format="value(name,zone)" \
            --quiet)

          if [ -z "$VMS" ]; then
            echo "⚠️  No running Odoo VMs found."
            exit 0
          fi

          echo "📋 Found VMs:"
          echo "$VMS"
          echo ""

          FAILED=0

          while IFS=$'\t' read -r VM_NAME VM_ZONE; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Deploying to $VM_NAME ($VM_ZONE)..."

            if gcloud compute ssh "vigbe@$VM_NAME" \
              --project=odoo-ia-prop-com \
              --zone="$VM_ZONE" \
              --tunnel-through-iap \
              --command="cd ~/odoo_deploy_files && ./deploy_module.sh \"$MODULE_NAME\" \"$ENVIRONMENT\""; then
              echo "✅ $VM_NAME: Deploy successful"
            else
              echo "❌ $VM_NAME: Deploy failed"
              FAILED=1
            fi
          done <<< "$VMS"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ One or more VMs failed. Check logs above."
            exit 1
          fi

          echo "🎉 All VMs deployed successfully!"
